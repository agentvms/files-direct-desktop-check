# Throwaway check (files-direct-41, fd-cpa): runs release.yml's desktop-build job as written there (only its "needs: release" line is left out), by hand, so the
# Mac disk images and the Windows installer a version tag would build can be seen with their sizes. It publishes nothing and has no secrets.
name: desktop-build-check

on:
  workflow_dispatch:

permissions: {}

jobs:
  desktop-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
          - os: macos-15-intel
            target: mac-x64
          - os: windows-2022
            target: win-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Build the app and the files a person downloads
        run: node scripts/app-build.mjs ${{ matrix.target }} build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            app-out/files-direct-*
          if-no-files-found: error

  # Added for files-direct-41 only (not in release.yml): opens the app that was just built the way a person does and lists the processes it started, to see the tray program start
  # "listen --app". Mac: the disk image is mounted and the app in it started. Windows: the installer runs silently as the current user, which starts the tray program.
  tray-listens:
    needs: desktop-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
          - os: macos-15-intel
            target: mac-x64
          - os: windows-2022
            target: win-x64
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-${{ matrix.target }}
          path: dl
      - name: Mac, open the app from the disk image and list what it started
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          ls -l dl
          mkdir -p "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/apps"
          hdiutil attach -nobrowse -readonly -quiet -mountpoint "$RUNNER_TEMP/mnt" dl/files-direct-*-${{ matrix.target }}.dmg
          ls "$RUNNER_TEMP/mnt"
          cp -R "$RUNNER_TEMP/mnt/Files Direct.app" "$RUNNER_TEMP/apps/"
          hdiutil detach -quiet "$RUNNER_TEMP/mnt" || true
          nohup "$RUNNER_TEMP/apps/Files Direct.app/Contents/MacOS/FilesDirect" >"$RUNNER_TEMP/tray.log" 2>&1 &
          TRAY=$!
          echo "menu-bar program pid $TRAY"
          sleep 25
          echo "--- processes with 'listen' in the command line:"
          ps -axo pid,ppid,command | grep -F 'listen' | grep -v grep || true
          ps -axo pid,ppid,command | grep -F 'files-direct.mjs listen --app' | grep -v grep > "$RUNNER_TEMP/found.txt" || true
          cat "$RUNNER_TEMP/tray.log" || true
          test -s "$RUNNER_TEMP/found.txt" || { echo "::error::no 'listen --app' process"; exit 1; }
          awk -v t="$TRAY" '{ if ($2 == t) ok = 1 } END { if (!ok) { print "::error::listen --app is not a child of the menu-bar program"; exit 1 } print "listen --app is a child of the menu-bar program (pid " t ")" }' "$RUNNER_TEMP/found.txt"
          kill "$TRAY" || true
          sleep 8
          echo "--- after the menu-bar program ended:"
          ps -axo pid,ppid,command | grep -F 'listen --app' | grep -v grep || echo "(none left)"
      - name: Windows, install silently and list what the tray program started
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dl | Format-Table Name, Length
          $setup = (Get-ChildItem dl -Filter 'files-direct-setup-*-win-x64.exe').FullName
          # no -Wait: it would also wait for the tray program the installer starts and never come back
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(240000)) { Write-Error 'the installer did not end in 4 minutes'; exit 1 }
          "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 25
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Files Direct'
          Get-Process | Where-Object { $_.Path -like '*\Programs\Files Direct\*' } | ForEach-Object { "running: $($_.ProcessName) $($_.Id)" }
          $all = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*files-direct.mjs*listen*' }
          $all | ForEach-Object { "process $($_.ProcessId) (parent $($_.ParentProcessId)): $($_.CommandLine)" }
          $tray = Get-Process -Name 'Files Direct' -ErrorAction SilentlyContinue
          if (-not $tray) { Write-Error 'the tray program is not running'; exit 1 }
          $mine = $all | Where-Object { $_.CommandLine -like '*listen --app*' -and $_.ParentProcessId -eq $tray.Id }
          if (-not $mine) { Write-Error 'no listen --app process under the tray program'; exit 1 }
          "listen --app is a child of the tray program (pid $($tray.Id))"
          & (Join-Path $dir 'Files Direct.exe') quit
          Start-Sleep -Seconds 8
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*listen --app*' }
          if ($left) { "still running after quit:"; $left | ForEach-Object { $_.CommandLine } } else { "(none left after quit)" }
