name: shots
on:
  push:
    branches: [shots]
permissions:
  contents: read
jobs:
  listing:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Build the Store package of this tree with the real identity
        env:
          FD_STORE_IDENTITY_NAME: ${{ vars.FD_STORE_IDENTITY_NAME }}
          FD_STORE_PUBLISHER: ${{ vars.FD_STORE_PUBLISHER }}
          FD_STORE_PUBLISHER_NAME: ${{ vars.FD_STORE_PUBLISHER_NAME }}
        run: node scripts/app-store.mjs build
      - name: Take the listing shots
        shell: powershell
        run: ./scripts/shots-listing.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shots-listing
          path: |
            listing
            raw
            store-out/build-store.json
