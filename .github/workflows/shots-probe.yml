name: shots
on:
  push:
    branches: [shots]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.14.0'
      - name: Install the released v0.2.1 Windows installer and take the shots
        shell: powershell
        run: ./scripts/shots.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
